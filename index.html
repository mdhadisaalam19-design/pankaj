
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Terminal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #00ff66;
            font-family: monospace;
            min-height: 100vh;
        }

        .terminal {
            width: 100%;
            min-height: 100vh;
            padding: 15px;
            background: #000;
        }

        .top {
            color: #00ff66;
            margin-bottom: 10px;
        }

        #output {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .prompt {
            color: #00ff66;
            margin-right: 8px;
        }

        #command {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: monospace;
            font-size: 16px;
            caret-color: #00ff66;
        }

        #mediaContainer {
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        video,
        img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            background: #111;
        }

        .error {
            color: #ff4444;
        }

        .info {
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="terminal">

    <div class="top">
        Welcome to MediaTermux<br>
        Type <b>help</b> for commands.
    </div>

    <div id="output"></div>

    <div class="input-line">
        <span class="prompt">user@media:~$</span>
        <input
            type="text"
            id="command"
            autocomplete="off"
            autofocus
            placeholder="type command..."
        >
    </div>

    <div id="mediaContainer">

        <video id="videoPlayer" controls></video>

        <img id="imagePlayer" alt="Image">

    </div>

</div>


<script>

const commandInput = document.getElementById("command");
const output = document.getElementById("output");

const mediaContainer =
    document.getElementById("mediaContainer");

const videoPlayer =
    document.getElementById("videoPlayer");

const imagePlayer =
    document.getElementById("imagePlayer");

let currentURL = null;


// Print text in terminal
function print(text, className = "") {

    const line = document.createElement("div");

    line.textContent = text;

    if (className) {
        line.className = className;
    }

    output.appendChild(line);

    window.scrollTo(0, document.body.scrollHeight);
}


// Hide media
function hideMedia() {

    mediaContainer.style.display = "none";

    videoPlayer.style.display = "none";
    imagePlayer.style.display = "none";

    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    imagePlayer.removeAttribute("src");

    if (currentURL) {
        URL.revokeObjectURL(currentURL);
        currentURL = null;
    }
}


// Open a file
async function openFile(filename) {

    print("Opening: " + filename);

    /*
       Browser security requires the user to choose
       the local file.
    */

    try {

        // Modern browsers
        if ("showOpenFilePicker" in window) {

            const handles = await window.showOpenFilePicker({
                multiple: false
            });

            const file = await handles[0].getFile();

            if (file.name !== filename) {

                print(
                    "Error: selected file is \"" +
                    file.name +
                    "\"",
                    "error"
                );

                print(
                    "Expected: " + filename,
                    "error"
                );

                return;
            }

            displayFile(file);

        }

        // Fallback for browsers without showOpenFilePicker
        else {

            const input = document.createElement("input");

            input.type = "file";
            input.accept = "video/*,image/*";

            input.onchange = function () {

                const file = input.files[0];

                if (!file) {
                    return;
                }

                if (file.name !== filename) {

                    print(
                        "Error: selected file is \"" +
                        file.name +
                        "\"",
                        "error"
                    );

                    print(
                        "Expected: " + filename,
                        "error"
                    );

                    return;
                }

                displayFile(file);
            };

            input.click();
        }

    } catch (error) {

        if (error.name !== "AbortError") {

            print(
                "Could not open file.",
                "error"
            );
        }
    }
}


// Display video or image
function displayFile(file) {

    hideMedia();

    currentURL = URL.createObjectURL(file);

    mediaContainer.style.display = "block";

    if (file.type.startsWith("video/")) {

        videoPlayer.src = currentURL;
        videoPlayer.style.display = "block";

        print(
            "Video opened: " + file.name
        );

        videoPlayer.play().catch(() => {});

    }

    else if (file.type.startsWith("image/")) {

        imagePlayer.src = currentURL;
        imagePlayer.style.display = "block";

        print(
            "Image opened: " + file.name
        );

    }

    else {

        print(
            "Unsupported file type.",
            "error"
        );

        hideMedia();
    }
}


// Commands
commandInput.addEventListener("keydown", function(event) {

    if (event.key !== "Enter") {
        return;
    }

    const command = commandInput.value.trim();

    if (!command) {
        return;
    }

    print(
        "user@media:~$ " + command
    );

    commandInput.value = "";

    const parts = command.split(/\s+/);

    const cmd = parts[0].toLowerCase();


    // HELP
    if (cmd === "help") {

        print("");
        print("Commands:");
        print("  open video.mp4");
        print("  open photo.jpg");
        print("  clear");
        print("  help");
        print("");

    }


    // CLEAR
    else if (cmd === "clear") {

        output.innerHTML = "";

        hideMedia();

    }


    // OPEN
    else if (cmd === "open") {

        if (!parts[1]) {

            print(
                "Usage: open filename.mp4",
                "error"
            );

            return;
        }

        // Supports filenames containing spaces
        const filename = command.substring(
            command.indexOf(" ") + 1
        ).trim();

        openFile(filename);

    }


    // EXIT
    else if (cmd === "exit") {

        print("You can close this tab.");

    }


    // Unknown command
    else {

        print(
            "Command not found: " + cmd,
            "error"
        );

        print(
            "Type 'help' for available commands."
        );
    }

});

</script>

</body>
</html>
